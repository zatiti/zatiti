# Release qualification orchestration.
#
# This workflow decides whether a version tag is qualified. It does not build
# a release, publish, sign, tag, or deploy, and a passing verdict grants no
# release permission: a maintainer reads the retained verdict and evidence and
# publishes by a separate, reviewed process.
#
# It starts only from a version tag (a tag push, or a manual dispatch started
# from the tag with the same version typed in) whose commit is reachable from
# main. Every gate below is required. A gate whose prerequisite is not
# implemented fails with prerequisite_missing; it never skips. The verdict job
# compiles in the required gate list, so deleting a gate blocks the verdict.
# Rules are enforced by .github/workflows/cigate; see README.md here.
name: release-qualification

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to qualify. Must equal the tag this run starts from.
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-qualification-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  inputs:
    name: release inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Resolve the version and require a reviewed, tagged commit
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: go run ./.github/workflows/cigate inputs -out "$EVIDENCE/inputs.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-inputs
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  spec:
    name: specification drift
    needs: inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the generated specification first
        run: python3 tools/specgen/render.py --check
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Run the specification integrity tests
        run: |
          python3 --version
          python3 -m unittest discover -s tools/specgen -p 'test_*.py'
      - name: Regenerate from a clean checkout and require no drift
        run: |
          python3 tools/specgen/render.py
          go run ./.github/workflows/cigate drift
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-spec
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  workflows:
    name: workflow validation
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Install the pinned workflow linter
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Validate the workflows
        env:
          ZATITI_REQUIRE_ACTIONLINT: "1"
        run: |
          go run ./.github/workflows/cigate lint -dir .github/workflows
          go vet ./.github/workflows/...
          go run ./.github/workflows/cigate gotest -strict -name workflows -out-dir "$EVIDENCE" -- -timeout 20m -race ./.github/workflows/...
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-workflows
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  static:
    name: static checks, dependency lock and notices
    needs: spec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
          go mod verify
          go mod tidy -diff
      - name: Verify the license text
        run: go run ./.github/workflows/cigate notices -license LICENSE
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt must print nothing, but lists:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./... ./.github/workflows/...
      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.3
          "$(go env GOPATH)/bin/golangci-lint" run --max-same-issues=0 ./... ./.github/workflows/...
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-static
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  test:
    name: build and test, including tests/integration and controlled provider and subprocess parity
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          case "$EXPECTED_IMAGE" in
            ubuntu-24.04) expected_os=Linux; expected_runner=X64; expected_uname=x86_64 ;;
            macos-15) expected_os=macOS; expected_runner=ARM64; expected_uname=arm64 ;;
            macos-15-intel) expected_os=macOS; expected_runner=X64; expected_uname=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$expected_os"
          test "$RUNNER_ARCH" = "$expected_runner"
          test "$(uname -m)" = "$expected_uname"
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
          go mod verify
      - name: Require the integration suite and the command-line entrypoint
        run: |
          go run ./.github/workflows/cigate require -kind tests tests/integration
          go run ./.github/workflows/cigate require -kind main cmd/zatiti
      - name: Build
        run: go build ./... ./.github/workflows/...
      - name: Test without skips
        env:
          TMPDIR: /tmp/zt
        run: |
          mkdir -p /tmp/zt
          go run ./.github/workflows/cigate gotest -strict -name unit -require-tests "github.com/zatiti/zatiti/internal/platform#TestListenPrivateRefusesSymlinkedRunDirectory,github.com/zatiti/zatiti/internal/platform#TestBlobTamperedObjectFailsPublishOverExisting" -out-dir "$EVIDENCE" -- -timeout 30m ./...
      - name: Test with the race detector without skips
        env:
          TMPDIR: /tmp/zt
        run: |
          mkdir -p /tmp/zt
          go run ./.github/workflows/cigate gotest -strict -name race -require-tests "github.com/zatiti/zatiti/internal/platform#TestListenPrivateRefusesSymlinkedRunDirectory,github.com/zatiti/zatiti/internal/platform#TestBlobTamperedObjectFailsPublishOverExisting" -out-dir "$EVIDENCE" -- -timeout 40m -race ./...
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-test-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  flutter:
    name: flutter desktop client
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          case "$EXPECTED_IMAGE" in
            ubuntu-24.04) expected_os=Linux; expected_runner=X64; expected_uname=x86_64 ;;
            macos-15) expected_os=macOS; expected_runner=ARM64; expected_uname=arm64 ;;
            macos-15-intel) expected_os=macOS; expected_runner=X64; expected_uname=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$expected_os"
          test "$RUNNER_ARCH" = "$expected_runner"
          test "$(uname -m)" = "$expected_uname"
          case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; X64) arch=amd64 ;; esac
          echo "CANDIDATE_ARCH=$arch" >> "$GITHUB_ENV"
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Resolve the pinned Flutter SDK
        id: pin
        run: go run ./.github/workflows/cigate flutterpin -out "$EVIDENCE/flutter-pin.json"
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libsecret-1-dev libsecret-1-0 xvfb
      - name: Install the pinned Flutter SDK from its tagged commit
        env:
          FLUTTER_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version --machine > "$EVIDENCE/flutter-version.json"
          go run ./.github/workflows/cigate flutterverify -version-file "$EVIDENCE/flutter-version.json"
      - name: Get dependencies with the lock enforced
        run: go run ./.github/workflows/cigate bounded -name pub-get -out-dir "$EVIDENCE" -dir apps/desktop -- flutter pub get --enforce-lockfile
      - name: Check Dart formatting
        run: go run ./.github/workflows/cigate bounded -name dart-format -out-dir "$EVIDENCE" -dir apps/desktop -- dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: go run ./.github/workflows/cigate bounded -name flutter-analyze -out-dir "$EVIDENCE" -dir apps/desktop -- flutter analyze
      - name: Run the unit and widget tests, including the operation-catalog digest drift check
        run: go run ./.github/workflows/cigate fluttertest -strict -name flutter-test -out-dir "$EVIDENCE" -dir apps/desktop
      - name: Build the release-mode Linux application
        if: runner.os == 'Linux'
        run: go run ./.github/workflows/cigate bounded -name flutter-build -out-dir "$EVIDENCE" -dir apps/desktop -- flutter build linux --release
      - name: Build the release-mode macOS application
        if: runner.os == 'macOS'
        run: go run ./.github/workflows/cigate bounded -name flutter-build -out-dir "$EVIDENCE" -dir apps/desktop -- flutter build macos --release
      - name: Audit and archive the unsigned native desktop candidate
        run: |
          bundle="$GITHUB_WORKSPACE/apps/desktop/build/macos/Build/Products/Release/zatiti_desktop.app"
          candidate="$RUNNER_TEMP/candidate"
          mkdir -p "$candidate"
          cp LICENSE "$candidate/LICENSE"
          cp docs/implementation/dependencies.lock.json "$candidate/dependencies.lock.json"
          cp apps/desktop/pubspec.lock "$candidate/pubspec.lock"
          archive="$candidate/zatiti-unsigned-darwin-$CANDIDATE_ARCH-desktop.tar.gz"
          go run ./packaging/cmd/zatiti-pack assemble-bundle --dir "$bundle" --archive "$archive" > "$EVIDENCE/desktop-archive.json"
          go run ./.github/workflows/cigate candidate -kind desktop -arch "$CANDIDATE_ARCH" -root "$bundle" -archive "$archive" -license "$candidate/LICENSE" -dependency-lock "$candidate/dependencies.lock.json" -pubspec-lock "$candidate/pubspec.lock" -revision "$GITHUB_SHA" -out "$EVIDENCE/desktop-candidate.json"
          cp "$EVIDENCE/desktop-candidate.json" "$candidate/candidate.json"
      - name: Require the integration_test suite
        run: go run ./.github/workflows/cigate require -kind dir apps/desktop/integration_test
      - name: Run integration_test on Linux under a virtual display
        if: runner.os == 'Linux'
        run: go run ./.github/workflows/cigate fluttertest -strict -prefix "xvfb-run --auto-servernum" -name integration-test-linux -out-dir "$EVIDENCE" -dir apps/desktop -- integration_test -d linux
      - name: Run integration_test on macOS
        if: runner.os == 'macOS'
        run: go run ./.github/workflows/cigate fluttertest -strict -name integration-test-macos -out-dir "$EVIDENCE" -dir apps/desktop -- integration_test -d macos
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-flutter-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  qualification:
    name: platform, client, adapter and packaging qualification
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          case "$EXPECTED_IMAGE" in
            ubuntu-24.04) expected_os=Linux; expected_runner=X64; expected_uname=x86_64 ;;
            macos-15) expected_os=macOS; expected_runner=ARM64; expected_uname=arm64 ;;
            macos-15-intel) expected_os=macOS; expected_runner=X64; expected_uname=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$expected_os"
          test "$RUNNER_ARCH" = "$expected_runner"
          test "$(uname -m)" = "$expected_uname"
          case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; X64) arch=amd64 ;; *) exit 1 ;; esac
          echo "QUALIFICATION_ARCH=$arch" >> "$GITHUB_ENV"
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
          go mod verify
      - name: Require the qualification suite
        run: go run ./.github/workflows/cigate require -kind tests tests/qualification
      - name: Run the qualification suite without skips
        env:
          TMPDIR: /tmp/zt
          ZATITI_QUALIFICATION_EVIDENCE: ${{ runner.temp }}/evidence/qualification-cases
        run: |
          mkdir -p /tmp/zt
          go run ./.github/workflows/cigate gotest -strict -name qualification -out-dir "$EVIDENCE" -- -timeout 40m ./tests/qualification/...
      - name: Enforce qualification case enumeration and evidence freshness
        run: |
          go run ./.github/workflows/cigate qualevidence \
            -report "$EVIDENCE/qualification-cases/release-report.json" \
            -require-gate "Z01,Z04,Z13,Z16,Z21,JOURNEY,QUALIFICATION" \
            -require-case "Z21.first_conversation,QUALIFICATION.macos_pkg_binding,QUALIFICATION.macos_gui_secret_helper,QUALIFICATION.macos_serenity_hard_gate,QUALIFICATION.macos_bootstrap_entrypoint" \
            -platform "darwin/$QUALIFICATION_ARCH" \
            -out "$EVIDENCE/qualification-verdict.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-qualification-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  build:
    name: reproducible-input build and provenance
    needs: spec
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native runner architecture
        env:
          EXPECTED_IMAGE: ${{ matrix.os }}
        run: |
          case "$EXPECTED_IMAGE" in
            ubuntu-24.04) expected_os=Linux; expected_runner=X64; expected_uname=x86_64 ;;
            macos-15) expected_os=macOS; expected_runner=ARM64; expected_uname=arm64 ;;
            macos-15-intel) expected_os=macOS; expected_runner=X64; expected_uname=x86_64 ;;
            *) exit 1 ;;
          esac
          test "$RUNNER_OS" = "$expected_os"
          test "$RUNNER_ARCH" = "$expected_runner"
          test "$(uname -m)" = "$expected_uname"
          case "$RUNNER_ARCH" in ARM64) arch=arm64 ;; X64) arch=amd64 ;; esac
          echo "CANDIDATE_ARCH=$arch" >> "$GITHUB_ENV"
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
          go mod verify
      - name: Require the command-line entrypoint
        run: go run ./.github/workflows/cigate require -kind main cmd/zatiti
      - name: Build from the unmodified tagged commit
        env:
          CGO_ENABLED: "1"
        run: |
          test "$(go env CGO_ENABLED)" = 1
          mkdir -p "$RUNNER_TEMP/candidate"
          go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/candidate/zatiti" ./cmd/zatiti
          go version -m "$RUNNER_TEMP/candidate/zatiti" | grep -Eq '^[[:space:]]*build[[:space:]]+CGO_ENABLED=1$'
          nm "$RUNNER_TEMP/candidate/zatiti" | grep -F '_SecItemAdd' >/dev/null
          nm "$RUNNER_TEMP/candidate/zatiti" | grep -F '_SecItemUpdate' >/dev/null
      - name: Record and verify build provenance
        run: go run ./.github/workflows/cigate provenance -go-version "$(go env GOVERSION)" -out "$EVIDENCE/provenance.json" "$RUNNER_TEMP/candidate/zatiti"
      - name: Audit and archive the unsigned native controller candidate
        run: |
          candidate="$RUNNER_TEMP/candidate"
          mkdir -p "$candidate/controller-tree/bin"
          cp "$candidate/zatiti" "$candidate/controller-tree/bin/zatiti"
          cp LICENSE "$candidate/controller-tree/LICENSE"
          cp docs/implementation/dependencies.lock.json "$candidate/dependencies.lock.json"
          cp LICENSE "$candidate/LICENSE"
          archive="$candidate/zatiti-unsigned-darwin-$CANDIDATE_ARCH-controller.tar.gz"
          go run ./packaging/cmd/zatiti-pack assemble-bundle --dir "$candidate/controller-tree" --archive "$archive" > "$EVIDENCE/controller-archive.json"
          go run ./.github/workflows/cigate candidate -kind controller -arch "$CANDIDATE_ARCH" -root "$candidate/zatiti" -archive "$archive" -license "$candidate/LICENSE" -dependency-lock "$candidate/dependencies.lock.json" -revision "$GITHUB_SHA" -out "$EVIDENCE/controller-candidate.json"
          cp "$EVIDENCE/controller-candidate.json" "$candidate/candidate.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-build-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30

  candidate_matrix:
    name: unsigned native Mac candidate matrix
    needs:
      - spec
      - build
      - flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Download native Intel controller candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-build-macos-15-intel
          path: ${{ runner.temp }}/matrix/controller-amd64
      - name: Download native Intel desktop candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-flutter-macos-15-intel
          path: ${{ runner.temp }}/matrix/desktop-amd64
      - name: Download native Apple Silicon controller candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-build-macos-15
          path: ${{ runner.temp }}/matrix/controller-arm64
      - name: Download native Apple Silicon desktop candidate
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-flutter-macos-15
          path: ${{ runner.temp }}/matrix/desktop-arm64
      - name: Verify the four unsigned native candidates
        run: |
          go run ./.github/workflows/cigate candidate-matrix -root "$RUNNER_TEMP/matrix" -revision "$GITHUB_SHA" -license "$GITHUB_WORKSPACE/LICENSE" -dependency-lock "$GITHUB_WORKSPACE/docs/implementation/dependencies.lock.json" -pubspec-lock "$GITHUB_WORKSPACE/apps/desktop/pubspec.lock" -out "$EVIDENCE/unsigned-candidate-matrix.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-candidate-matrix
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  qualification_matrix:
    name: native Mac final-release evidence matrix
    needs:
      - spec
      - qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Download native Intel qualification evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-qualification-macos-15-intel
          path: ${{ runner.temp }}/native-reports/amd64
      - name: Download native Apple Silicon qualification evidence
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: release-evidence-qualification-macos-15
          path: ${{ runner.temp }}/native-reports/arm64
      - name: Bind both clean-host reports to one final signed release
        run: |
          go run ./.github/workflows/cigate qualmatrix \
            -amd64-report "$RUNNER_TEMP/native-reports/amd64/qualification-cases/release-report.json" \
            -arm64-report "$RUNNER_TEMP/native-reports/arm64/qualification-cases/release-report.json" \
            -revision "$GITHUB_SHA" \
            -out "$EVIDENCE/native-qualification-matrix.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-native-qualification-matrix
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30

  verdict:
    name: release qualification verdict
    if: always()
    needs:
      - inputs
      - spec
      - workflows
      - static
      - test
      - flutter
      - qualification
      - build
      - candidate_matrix
      - qualification_matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the toolchain and dependency lock
        env:
          GOTOOLCHAIN: local
        run: |
          evidence="$RUNNER_TEMP/evidence"
          echo "EVIDENCE=$evidence" >> "$GITHUB_ENV"
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          go run ./.github/workflows/cigate lock -go-version "$(go env GOVERSION)"
          go run ./.github/workflows/cigate environ -go-version "$(go env GOVERSION)" -out "$evidence/environment.json"
      - name: Decide the verdict from every required gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_VERSION: ${{ needs.inputs.outputs.version }}
        run: go run ./.github/workflows/cigate gate -out "$EVIDENCE/verdict.json"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-verdict
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 30
